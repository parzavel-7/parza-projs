<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="con">
        <div class="img">
            <img src="pics/a.jpg" alt="mine" class="srj">
        </div>
    
        <div class="namebox">
            <span class="name">Suraj Ganesh</span>
            <span class="role">Student and Developer</span>
        </div>
        
        <div class="links">
            <a href="http://facebook.com" class="l"><i class='bx bxl-facebook'></i></a>
            <a href="http://instagram.com" class="l"><i class='bx bxl-instagram' ></i></a>
            <a href="http://youtube.com" class="l"><i class='bx bxl-youtube' ></i></a>
            <a href="http://aniwave.com" class="l"><i class='bx bx-tv' ></i></a>
        </div>

        <div class="contact">
            <button>
                <a href="#" id="btn">Click Me</a>
            </button>
        </div>

        <div class="lk">
            <span class="li"><i class='bx bx-heart'></i> 40k |
            <i class='bx bx-comment' ></i> 20k |
            <i class='bx bx-share' ></i> 9k</span>
        </div>
    </div>
</body>
</html>
